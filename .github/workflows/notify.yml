name: Notify

on:
  workflow_dispatch: 
  push:
  create:
  delete:
  watch:
  fork:
  issues:
    types: [opened, closed, reopened, edited, assigned, labeled]
  pull_request:
    types: [opened, closed, reopened, synchronize, edited, assigned, labeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  release:
    types: [published, created, edited, deleted, prereleased]
  discussion:
    types: [created, edited, deleted, answered]
  workflow_run:
    types: [completed]
  gollum:
  member:
    types: [added, edited, removed]
  public:
  deployment:
    types: [created]
  deployment_status:
  page_build:
  project:
    types: [created, edited, closed, reopened, deleted]
  project_card:
    types: [created, edited, moved, converted, deleted]
  project_column:
    types: [created, edited, moved, deleted]
  registry_package:
    types: [published, updated]
  status:
  schedule:
    - cron: "0 0 * * *"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        run: |
          curl -X POST https://corerudo.larten.ru/webhook \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "${{ secrets.NOTIFY_CHAT_ID }}",
              "thread_id": "${{ secrets.NOTIFY_THREAD_ID }}",
              "repo": "${{ github.repository }}",
              "text": "🚀 *${{ github.event_name }}* in `${{ github.repository }}`\n\n${{ github.event.head_commit.message || github.event.issue.title || github.event.pull_request.title || github.event.release.name || github.event.discussion.title || github.event.ref || '' }}\n\n[View on GitHub](${{ github.event.head_commit.url || github.event.issue.html_url || github.event.pull_request.html_url || github.event.release.html_url || github.event.discussion.html_url || github.event.repository.html_url }})"
            }'
